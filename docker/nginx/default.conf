map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name crowdcam.co.za www.crowdcam.co.za email.crowdcam.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name crowdcam.co.za www.crowdcam.co.za;

    ssl_certificate /etc/letsencrypt/live/crowdcam.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crowdcam.co.za/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name email.crowdcam.co.za;

    ssl_certificate /etc/letsencrypt/live/crowdcam.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crowdcam.co.za/privkey.pem;

    location = /reset-password {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(css|js|images)/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 302 https://crowdcam.co.za$request_uri;
    }
}
