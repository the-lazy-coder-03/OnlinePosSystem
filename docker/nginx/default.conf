map $http_upgrade $websocket_upgrade {
    default '';
    ~*^websocket$ websocket;
}

map $websocket_upgrade $connection_upgrade {
    default close;
    websocket upgrade;
}

server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name crowdcam.co.za www.crowdcam.co.za email.crowdcam.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://crowdcam.co.za$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/crowdcam.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crowdcam.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name crowdcam.co.za www.crowdcam.co.za;

    ssl_certificate /etc/letsencrypt/live/crowdcam.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crowdcam.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location ~ /\. { deny all; }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 65s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name email.crowdcam.co.za;

    ssl_certificate /etc/letsencrypt/live/crowdcam.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crowdcam.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location ~ /\. { deny all; }

    location = /reset-password {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(css|js|images)/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 302 https://crowdcam.co.za$request_uri;
    }
}
