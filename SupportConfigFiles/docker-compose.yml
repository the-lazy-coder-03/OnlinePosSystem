name: onlinepossystem

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_pos_system}
      POSTGRES_USER: ${POSTGRES_USER:-pos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in SupportConfigFiles/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: SupportConfigFiles/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-online_pos_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pos_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in SupportConfigFiles/.env}
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      STAFF_CONFIG_PATH: /app/config/staff-config.json
    volumes:
      - ../Misc/staff-config.json:/app/config/staff-config.json:ro

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker/certbot/www:/var/www/certbot:ro
      - ../docker/certbot/conf:/etc/letsencrypt:ro
    command: >-
      /bin/sh -c 'while :; do sleep 21600; nginx -s reload; done &
      exec nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ../docker/certbot/www:/var/www/certbot
      - ../docker/certbot/conf:/etc/letsencrypt

  certbot-renew:
    image: certbot/certbot:latest
    depends_on:
      - nginx
    volumes:
      - ../docker/certbot/www:/var/www/certbot
      - ../docker/certbot/conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path /var/www/certbot --quiet;
        sleep 43200 & wait $!;
      done

volumes:
  postgres_data:
