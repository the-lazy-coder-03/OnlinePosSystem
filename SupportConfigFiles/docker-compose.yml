name: onlinepossystem

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_pos_system}
      POSTGRES_USER: ${POSTGRES_USER:-pos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in SupportConfigFiles/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: SupportConfigFiles/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-online_pos_system}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-pos_runtime}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set the restricted runtime password}
      SPRING_PROFILES_ACTIVE: default
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-7200}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      APP_BASE_URL: ${APP_BASE_URL:-https://crowdcam.co.za}
      RESEND_API_KEY: ${RESEND_API_KEY:-${MAIL_API:-}}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@email.crowdcam.co.za}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0

  provision:
    image: postgres:16-alpine
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-online_pos_system}
      PGUSER: ${POSTGRES_USER:-pos_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set the database administrator password}
      MIGRATION_DATASOURCE_USERNAME: ${MIGRATION_DATASOURCE_USERNAME:-pos_owner}
      MIGRATION_DATASOURCE_PASSWORD: ${MIGRATION_DATASOURCE_PASSWORD:?Set the migration password}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-pos_runtime}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set the runtime password}
    volumes:
      - ../scripts:/work/scripts:ro
    entrypoint: ["bash", "/work/scripts/provision-rls.sh"]

  migrate:
    build:
      context: ..
      dockerfile: SupportConfigFiles/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      MIGRATION_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-online_pos_system}
      MIGRATION_DATASOURCE_USERNAME: ${MIGRATION_DATASOURCE_USERNAME:?Set the migration owner username}
      MIGRATION_DATASOURCE_PASSWORD: ${MIGRATION_DATASOURCE_PASSWORD:?Set the migration owner password}
      RLS_RUNTIME_ROLE: ${SPRING_DATASOURCE_USERNAME:-pos_runtime}
      RUN_MIGRATION_SQL: ${RUN_MIGRATION_SQL:-true}

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker/certbot/www:/var/www/certbot:ro
      - ../docker/certbot/conf:/etc/letsencrypt:ro
    command: >-
      /bin/sh -c 'while :; do sleep 21600; nginx -s reload; done &
      exec nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ../docker/certbot/www:/var/www/certbot
      - ../docker/certbot/conf:/etc/letsencrypt

  certbot-renew:
    image: certbot/certbot:latest
    depends_on:
      - nginx
    volumes:
      - ../docker/certbot/www:/var/www/certbot
      - ../docker/certbot/conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path /var/www/certbot --quiet;
        sleep 43200 & wait $!;
      done

volumes:
  postgres_data:
