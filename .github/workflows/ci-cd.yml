name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-pos-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend and RLS tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      RLS_TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
      RLS_TEST_ADMIN_USERNAME: postgres
      RLS_TEST_ADMIN_PASSWORD: ci-test-only
      SPRING_PROFILES_ACTIVE: postgres-test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      GOOGLE_MAPS_API_KEY: ci-placeholder
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Misc/pom.xml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run PostgreSQL tests and verify package
        run: ./scripts/test-postgres.sh -B verify -Prls-it

  browser-tests:
    name: Browser regression tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      RLS_TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
      RLS_TEST_ADMIN_USERNAME: postgres
      RLS_TEST_ADMIN_PASSWORD: ci-test-only
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      GOOGLE_MAPS_API_KEY: ci-placeholder
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Misc/pom.xml

      - name: Set up browser test runtime
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: SupportConfigFiles/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build browser test jar
        run: ./Misc/mvnw -f Misc/pom.xml -B package -DskipTests

      - name: Install browser test dependencies
        run: npm --prefix SupportConfigFiles ci

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('SupportConfigFiles/package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm --prefix SupportConfigFiles exec -- playwright install-deps chromium
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]]; then
            npm --prefix SupportConfigFiles exec -- playwright install chromium
          fi

      - name: Run browser regression tests
        run: npm --prefix SupportConfigFiles run test:browser

  validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate deployment script
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          unexpected_sql="$(git ls-files | grep -Ei '\.sql$' | grep -v '^SQL files/' || true)"
          if [[ -n "$unexpected_sql" ]]; then
            echo "SQL files must be stored in SQL files/:" >&2
            echo "$unexpected_sql" >&2
            exit 1
          fi
          for script in src/main/resources/static/js/*.js; do node --check "$script"; done
          python3 scripts/check-template-scripts.py

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [backend-tests, browser-tests, validation]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'master')
    timeout-minutes: 25
    concurrency:
      group: online-pos-system-production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          test -n "$AZURE_VM_HOST" || (echo "Missing AZURE_VM_HOST secret" && exit 1)
          test -n "$AZURE_VM_USER" || (echo "Missing AZURE_VM_USER secret" && exit 1)
          test -n "$AZURE_VM_SSH_KEY" || (echo "Missing AZURE_VM_SSH_KEY secret" && exit 1)

      - name: Build runtime environment file
        id: runtime-env
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          MIGRATION_DATASOURCE_USERNAME: ${{ secrets.MIGRATION_DATASOURCE_USERNAME }}
          MIGRATION_DATASOURCE_PASSWORD: ${{ secrets.MIGRATION_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          MAIL_API: ${{ secrets.MAIL_API }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
          RUN_MIGRATION_SQL: ${{ secrets.RUN_MIGRATION_SQL }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          mkdir -p runtime

          db_name="${POSTGRES_DB:-online_pos_system}"
          db_user="${POSTGRES_USER:-pos_app}"
          db_password="${POSTGRES_PASSWORD:-}"

          runtime_user="${SPRING_DATASOURCE_USERNAME:-pos_runtime}"
          runtime_password="${SPRING_DATASOURCE_PASSWORD:-}"
          migration_user="${MIGRATION_DATASOURCE_USERNAME:-}"
          migration_password="${MIGRATION_DATASOURCE_PASSWORD:-}"

          if [[ -z "$runtime_password" || -z "$migration_user" || -z "$migration_password" || -z "$db_password" || -z "$JWT_SECRET" || -z "$ADMIN_PASSWORD" || -z "${RESEND_API_KEY:-${MAIL_API:-}}" ]]; then
            echo "A complete runtime secret set was not provided; deployment will keep the existing server .env file."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$runtime_user" == "$migration_user" || "$runtime_user" == "$db_user" || "$migration_user" == "$db_user" ]]; then
            echo "Database administrator, migration owner, and runtime accounts must be separate" >&2
            exit 1
          fi

          {
            echo "POSTGRES_DB=${db_name}"
            echo "POSTGRES_USER=${db_user}"
            echo "POSTGRES_PASSWORD=${db_password}"
            echo "SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${db_name}"
            echo "SPRING_DATASOURCE_USERNAME=${runtime_user}"
            echo "SPRING_DATASOURCE_PASSWORD=${runtime_password}"
            echo "MIGRATION_DATASOURCE_URL=jdbc:postgresql://db:5432/${db_name}"
            echo "MIGRATION_DATASOURCE_USERNAME=${migration_user}"
            echo "MIGRATION_DATASOURCE_PASSWORD=${migration_password}"
            echo "RLS_RUNTIME_ROLE=${runtime_user}"
            echo "SERVER_ADDRESS=0.0.0.0"
            echo "SERVER_PORT=8080"
            echo "HTTP_PORT=80"
            echo "HTTPS_PORT=443"
            echo "SPRING_PROFILES_ACTIVE=default"
            echo "RUN_MIGRATION_SQL=${RUN_MIGRATION_SQL:-true}"
            echo "ADMIN_USERNAME=${ADMIN_USERNAME:-admin}"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_EXPIRATION_SECONDS=7200"
            echo "SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}"
            echo "APP_BASE_URL=${APP_BASE_URL:-https://crowdcam.co.za}"
            echo "RESEND_API_KEY=${RESEND_API_KEY:-${MAIL_API:-}}"
            echo "MAIL_API=${MAIL_API:-${RESEND_API_KEY:-}}"
            echo "RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-noreply@email.crowdcam.co.za}"
            echo "CERTBOT_EMAIL=${CERTBOT_EMAIL:-matthewanton01@gmail.com}"
            echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}"
          } > runtime/online-pos-system.env

          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AZURE_VM_SSH_KEY" > ~/.ssh/online-pos-azure
          chmod 600 ~/.ssh/online-pos-azure
          ssh-keyscan -p "${AZURE_VM_PORT:-22}" "$AZURE_VM_HOST" >> ~/.ssh/known_hosts

      - name: Upload runtime environment
        if: steps.runtime-env.outputs.created == 'true'
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
        run: |
          remote_env="/tmp/online-pos-system-${GITHUB_SHA}.env"
          scp -i ~/.ssh/online-pos-azure -P "${AZURE_VM_PORT:-22}" \
            runtime/online-pos-system.env \
            "${AZURE_VM_USER}@${AZURE_VM_HOST}:${remote_env}"

      - name: Upload deployment script
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
        run: |
          remote_script="/tmp/online-pos-system-deploy-${GITHUB_SHA}.sh"
          scp -i ~/.ssh/online-pos-azure -P "${AZURE_VM_PORT:-22}" \
            scripts/deploy-production.sh \
            "${AZURE_VM_USER}@${AZURE_VM_HOST}:${remote_script}"

      - name: Deploy Docker Compose stack
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
          RUNTIME_ENV_CREATED: ${{ steps.runtime-env.outputs.created }}
        run: |
          remote_env="/tmp/online-pos-system-${GITHUB_SHA}.env"
          remote_app_dir="${REMOTE_APP_DIR:-/home/${AZURE_VM_USER}/OnlinePosSystem}"
          quoted_remote_env="$(printf '%q' "$remote_env")"
          quoted_remote_app_dir="$(printf '%q' "$remote_app_dir")"
          quoted_branch="$(printf '%q' "$GITHUB_REF_NAME")"
          quoted_sha="$(printf '%q' "$GITHUB_SHA")"
          quoted_runtime_env_created="$(printf '%q' "$RUNTIME_ENV_CREATED")"
          remote_script="/tmp/online-pos-system-deploy-${GITHUB_SHA}.sh"
          quoted_remote_script="$(printf '%q' "$remote_script")"

          ssh -i ~/.ssh/online-pos-azure -p "${AZURE_VM_PORT:-22}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "REMOTE_ENV=${quoted_remote_env} REMOTE_APP_DIR=${quoted_remote_app_dir} DEPLOY_BRANCH=${quoted_branch} DEPLOY_SHA=${quoted_sha} RUNTIME_ENV_CREATED=${quoted_runtime_env_created} bash ${quoted_remote_script}"
