name: CI/CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: dev
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      GOOGLE_MAPS_API_KEY: ci-placeholder
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Build jar
        run: ./mvnw -B package -DskipTests

      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/app.jar
          cp staff-config.json deploy/staff-config.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-pos-system
          path: deploy/
          if-no-files-found: error

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'master' || github.ref_name == 'main'
    timeout-minutes: 15

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: online-pos-system
          path: deploy

      - name: Validate required secrets
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$AZURE_VM_HOST" || (echo "Missing AZURE_VM_HOST secret" && exit 1)
          test -n "$AZURE_VM_USER" || (echo "Missing AZURE_VM_USER secret" && exit 1)
          test -n "$AZURE_VM_SSH_KEY" || (echo "Missing AZURE_VM_SSH_KEY secret" && exit 1)
          test -n "$SPRING_DATASOURCE_PASSWORD" || (echo "Missing SPRING_DATASOURCE_PASSWORD secret" && exit 1)
          test -n "$JWT_SECRET" || (echo "Missing JWT_SECRET secret" && exit 1)

      - name: Build runtime environment file
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          MAIL_API: ${{ secrets.MAIL_API }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
          RUN_MIGRATION_SQL: ${{ secrets.RUN_MIGRATION_SQL }}
        run: |
          mkdir -p runtime
          {
            echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://127.0.0.1:5432/online_pos_system}"
            echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-pos_app}"
            echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}"
            echo "SERVER_ADDRESS=0.0.0.0"
            echo "SERVER_PORT=${SERVER_PORT:-8081}"
            echo "SPRING_PROFILES_ACTIVE=default"
            echo "ADMIN_USERNAME=${ADMIN_USERNAME:-admin}"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_EXPIRATION_SECONDS=7200"
            echo "SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}"
            echo "APP_BASE_URL=${APP_BASE_URL:-http://${AZURE_VM_HOST}:${SERVER_PORT:-8081}}"
            echo "RESEND_API_KEY=${RESEND_API_KEY:-${MAIL_API:-}}"
            echo "RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}"
            echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}"
            echo "RUN_MIGRATION_SQL=${RUN_MIGRATION_SQL:-true}"
          } > runtime/online-pos-system.env

      - name: Configure SSH
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AZURE_VM_SSH_KEY" > ~/.ssh/online-pos-azure
          chmod 600 ~/.ssh/online-pos-azure
          ssh-keyscan -p "${AZURE_VM_PORT:-22}" "$AZURE_VM_HOST" >> ~/.ssh/known_hosts

      - name: Upload release to Azure VM
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
        run: |
          remote_dir="/tmp/online-pos-system-${GITHUB_SHA}"
          ssh -i ~/.ssh/online-pos-azure -p "${AZURE_VM_PORT:-22}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" "rm -rf '${remote_dir}' && mkdir -p '${remote_dir}'"
          scp -i ~/.ssh/online-pos-azure -P "${AZURE_VM_PORT:-22}" \
            deploy/app.jar \
            deploy/staff-config.json \
            runtime/online-pos-system.env \
            "${AZURE_VM_USER}@${AZURE_VM_HOST}:${remote_dir}/"

      - name: Activate release on Azure VM
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          remote_dir="/tmp/online-pos-system-${GITHUB_SHA}"
          ssh -i ~/.ssh/online-pos-azure -p "${AZURE_VM_PORT:-22}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "test -x /usr/local/sbin/deploy-online-pos-system && sudo /usr/local/sbin/deploy-online-pos-system '${remote_dir}/app.jar' '${remote_dir}/staff-config.json' '${remote_dir}/online-pos-system.env'"
          ssh -i ~/.ssh/online-pos-azure -p "${AZURE_VM_PORT:-22}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "for i in {1..60}; do curl -fsS 'http://127.0.0.1:${SERVER_PORT:-8081}/' >/dev/null && exit 0; sleep 2; done; systemctl status online-pos-system --no-pager -l || true; sudo journalctl -u online-pos-system -n 120 --no-pager; exit 1"
