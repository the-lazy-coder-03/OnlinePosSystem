name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onlinepos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend and RLS tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      RLS_TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
      RLS_TEST_ADMIN_USERNAME: postgres
      RLS_TEST_ADMIN_PASSWORD: ci-test-only
      SPRING_PROFILES_ACTIVE: postgres-test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      RLS_CONTEXT_SECRET: ci-only-rls-context-secret-must-be-at-least-32-characters-long
      GOOGLE_MAPS_API_KEY: ci-placeholder
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Misc/pom.xml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify obsolete tests remain removed
        run: |
          obsolete_tests=(
            src/test/java/org/example/onlinepossystem/OnlinePosSystemApplicationTests.java
            src/test/java/org/example/onlinepossystem/RouteTest.java
            src/test/java/org/example/onlinepossystem/admin/AdminLiveOrderRenderingTest.java
            src/test/java/org/example/onlinepossystem/staff/service/StaffLoginTest.java
            src/test/java/org/example/onlinepossystem/staff/service/StaffServiceDependencyTest.java
          )
          for test_file in "${obsolete_tests[@]}"; do
            if [[ -e "$test_file" ]]; then
              echo "Obsolete test must not run in CI: $test_file" >&2
              exit 1
            fi
          done

      - name: Run PostgreSQL tests and verify package
        run: ./scripts/test-postgres.sh -B verify -Prls-it

  browser-tests:
    name: Browser regression tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      RLS_TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
      RLS_TEST_ADMIN_USERNAME: postgres
      RLS_TEST_ADMIN_PASSWORD: ci-test-only
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      RLS_CONTEXT_SECRET: ci-only-rls-context-secret-must-be-at-least-32-characters-long
      GOOGLE_MAPS_API_KEY: ci-placeholder
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Misc/pom.xml

      - name: Set up browser test runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: SupportConfigFiles/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build browser test jar
        run: ./Misc/mvnw -f Misc/pom.xml -B package -DskipTests

      - name: Install browser test dependencies
        run: npm --prefix SupportConfigFiles ci

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('SupportConfigFiles/package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm --prefix SupportConfigFiles exec -- playwright install-deps chromium
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]]; then
            npm --prefix SupportConfigFiles exec -- playwright install chromium
          fi

      - name: Run browser regression tests
        run: npm --prefix SupportConfigFiles run test:browser

  validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Validate deployment script
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          unexpected_sql="$(git ls-files | grep -Ei '\.sql$' | grep -v '^SQL files/' || true)"
          if [[ -n "$unexpected_sql" ]]; then
            echo "SQL files must be stored in SQL files/:" >&2
            echo "$unexpected_sql" >&2
            exit 1
          fi
          for script in src/main/resources/static/js/*.js; do node --check "$script"; done
          python3 scripts/check-template-scripts.py

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [backend-tests, browser-tests, validation]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'master')
    timeout-minutes: 25
    concurrency:
      group: onlinepos-production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate required secrets
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          test -n "$AZURE_VM_HOST" || (echo "Missing AZURE_VM_HOST secret" && exit 1)
          test -n "$AZURE_VM_USER" || (echo "Missing AZURE_VM_USER secret" && exit 1)
          test -n "$AZURE_VM_SSH_KEY" || (echo "Missing AZURE_VM_SSH_KEY secret" && exit 1)
          test -n "$AZURE_VM_KNOWN_HOSTS" || (echo "Missing AZURE_VM_KNOWN_HOSTS secret" && exit 1)

      - name: Configure SSH
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$AZURE_VM_SSH_KEY" > ~/.ssh/online-pos-azure
          chmod 600 ~/.ssh/online-pos-azure
          printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment script
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
        run: |
          remote_script="/tmp/onlinepos-deploy-${GITHUB_SHA}.sh"
          scp -i ~/.ssh/online-pos-azure -P "${AZURE_VM_PORT:-22}" \
            scripts/deploy-production.sh \
            "${AZURE_VM_USER}@${AZURE_VM_HOST}:${remote_script}"

      - name: Deploy Docker Compose stack
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
          DOPPLER_PROJECT: onlinepos
          DOPPLER_CONFIG: prd
        run: |
          remote_app_dir="${REMOTE_APP_DIR:-/home/${AZURE_VM_USER}/OnlinePosSystem}"
          quoted_remote_app_dir="$(printf '%q' "$remote_app_dir")"
          quoted_branch="$(printf '%q' "$GITHUB_REF_NAME")"
          quoted_sha="$(printf '%q' "$GITHUB_SHA")"
          quoted_doppler_project="$(printf '%q' "$DOPPLER_PROJECT")"
          quoted_doppler_config="$(printf '%q' "$DOPPLER_CONFIG")"
          remote_script="/tmp/onlinepos-deploy-${GITHUB_SHA}.sh"
          quoted_remote_script="$(printf '%q' "$remote_script")"

          ssh -i ~/.ssh/online-pos-azure -p "${AZURE_VM_PORT:-22}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "DOPPLER_ENABLED=true DOPPLER_PROJECT=${quoted_doppler_project} DOPPLER_CONFIG=${quoted_doppler_config} REMOTE_APP_DIR=${quoted_remote_app_dir} DEPLOY_BRANCH=${quoted_branch} DEPLOY_SHA=${quoted_sha} bash ${quoted_remote_script}"

      - name: Remove local deployment credentials
        if: always()
        run: rm -f ~/.ssh/online-pos-azure
