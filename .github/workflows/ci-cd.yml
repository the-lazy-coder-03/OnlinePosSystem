name: CI/CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: dev
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      GOOGLE_MAPS_API_KEY: ci-placeholder
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Build jar
        run: ./mvnw -B package -DskipTests

      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/app.jar
          cp staff-config.json deploy/staff-config.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-pos-system
          path: deploy/
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'master' || github.ref_name == 'main'

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: online-pos-system
          path: deploy

      - name: Validate required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$EC2_HOST" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "$EC2_USER" || (echo "Missing EC2_USER secret" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "Missing EC2_SSH_KEY secret" && exit 1)
          test -n "$SPRING_DATASOURCE_PASSWORD" || (echo "Missing SPRING_DATASOURCE_PASSWORD secret" && exit 1)
          test -n "$JWT_SECRET" || (echo "Missing JWT_SECRET secret" && exit 1)

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Build runtime environment file
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
        run: |
          mkdir -p runtime
          {
            echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://127.0.0.1:5432/online_pos_system}"
            echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-pos_app}"
            echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}"
            echo "SERVER_ADDRESS=0.0.0.0"
            echo "SERVER_PORT=${SERVER_PORT:-8081}"
            echo "SPRING_PROFILES_ACTIVE=default"
            echo "ADMIN_USERNAME=${ADMIN_USERNAME:-admin}"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_EXPIRATION_SECONDS=7200"
            echo "SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}"
            echo "APP_BASE_URL=${APP_BASE_URL:-http://${{ secrets.EC2_HOST }}:${SERVER_PORT:-8081}}"
            echo "MAIL_HOST=localhost"
            echo "MAIL_PORT=1025"
            echo "MAIL_USERNAME="
            echo "MAIL_PASSWORD="
            echo "MAIL_SMTP_AUTH=false"
            echo "MAIL_SMTP_STARTTLS=false"
            echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}"
          } > runtime/online-pos-system.env

      - name: Copy files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          PORT="${EC2_PORT:-22}"
          ssh -i ~/.ssh/ec2_key -p "$PORT" "$EC2_USER@$EC2_HOST" "mkdir -p /tmp/online-pos-system-deploy"
          scp -i ~/.ssh/ec2_key -P "$PORT" deploy/app.jar deploy/staff-config.json runtime/online-pos-system.env "$EC2_USER@$EC2_HOST:/tmp/online-pos-system-deploy/"

      - name: Activate release on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          PORT="${EC2_PORT:-22}"
          ssh -i ~/.ssh/ec2_key -p "$PORT" "$EC2_USER@$EC2_HOST" <<'EOF'
            set -euo pipefail
            sudo install -d -o onlinepos -g onlinepos /opt/online-pos-system
            sudo install -d -m 0750 -o root -g onlinepos /etc/online-pos-system
            sudo install -m 0640 -o root -g onlinepos /tmp/online-pos-system-deploy/online-pos-system.env /etc/online-pos-system/online-pos-system.env
            sudo install -m 0644 -o onlinepos -g onlinepos /tmp/online-pos-system-deploy/staff-config.json /opt/online-pos-system/staff-config.json
            sudo install -m 0644 -o onlinepos -g onlinepos /tmp/online-pos-system-deploy/app.jar /opt/online-pos-system/app.jar
            sudo systemctl daemon-reload
            sudo systemctl restart online-pos-system
            sudo systemctl is-active --quiet online-pos-system
            rm -rf /tmp/online-pos-system-deploy
          EOF
