# PostgreSQL / Neon database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Startup migration.sql runner. Updates the food/menu catalog while preserving customer order history.
# Set RUN_MIGRATION_SQL=false only when you intentionally want to skip migration.sql.
app.database.migration.enabled=${RUN_MIGRATION_SQL:true}

# Server settings
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}

# Secure session cookie settings. Set SESSION_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# Safe error responses
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never

# Email settings for password reset
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

# Zitadel OIDC login. Keep disabled until the server has a configured Zitadel app.
app.zitadel.enabled=${ZITADEL_ENABLED:false}
app.zitadel.issuer-uri=${ZITADEL_ISSUER_URI:}
app.zitadel.client-id=${ZITADEL_CLIENT_ID:}
app.zitadel.client-secret=${ZITADEL_CLIENT_SECRET:}
app.zitadel.roles-claim=${ZITADEL_ROLES_CLAIM:urn:zitadel:iam:org:project:roles}

# Logging
logging.level.org.springframework.security=DEBUG
