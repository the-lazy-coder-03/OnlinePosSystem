<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Pete's Pizza</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #e6f0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #333;
        }
        .panel {
            width: 380px;
            background: #fff;
            padding: 32px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0052cc;
            font-size: 1.8rem;
            margin: 0 0 20px;
            text-align: center;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border-radius: 15px;
            border: 2px solid #0052cc;
            background: #f0f6ff;
            font-size: 1rem;
        }
        button {
            width: 100%;
            height: 50px;
            margin-top: 18px;
            border: none;
            border-radius: 15px;
            background: #0052cc;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .message {
            margin-top: 14px;
            color: #0f5132;
            text-align: center;
        }
        .links {
            margin-top: 18px;
            text-align: center;
        }
        .links a { color: #0052cc; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
<main class="panel">
    <h1>Forgot Password</h1>
    <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Send Reset Link</button>
        <div th:if="${message}" class="message" th:text="${message}"></div>
    </form>
    <div class="links">
        <a th:href="@{/login}">Back to login</a>
    </div>
</main>
</body>
</html>
