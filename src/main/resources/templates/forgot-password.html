<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/password-recovery.css}">
    <title>Reset your password | Pete's Pizza</title>
</head>
<body class="recovery-page">
<main class="recovery-shell">
    <header class="recovery-brand" aria-label="Pete's Pizza">
        <span class="recovery-brand-mark" aria-hidden="true">P</span>
        <p class="recovery-brand-name">Pete's Pizza</p>
    </header>

    <section class="recovery-panel" aria-labelledby="recovery-title">
        <p class="recovery-eyebrow">Account recovery</p>
        <h1 class="recovery-title" id="recovery-title">Reset your password</h1>
        <p class="recovery-intro">Enter the email address linked to your account and we'll send you a secure reset link.</p>

        <form class="recovery-form" th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="recovery-field">
                <label for="email">Email address</label>
                <input class="recovery-input" id="email" name="email" type="email" autocomplete="email" required autofocus>
            </div>

            <button class="recovery-primary" type="submit">Send reset link</button>

            <p th:if="${message}" class="recovery-status recovery-status-success" role="status" aria-live="polite" th:text="${message}"></p>
        </form>

        <p class="recovery-link-row"><a class="recovery-link" th:href="@{/login}">Back to login</a></p>
    </section>
</main>
</body>
</html>
