<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset your password | Pete's Pizza</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            color: #333;
        }

        header {
            background-color: #0052cc;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 { font-size: 3em; margin: 0; }
        header p { font-size: 1.2em; margin: 5px 0; }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        nav a {
            text-decoration: none;
            color: #0052cc;
            font-weight: bold;
            padding: 12px 25px;
            border: 2px solid #0052cc;
            border-radius: 15px;
            transition: all 0.3s;
            font-size: 1em;
        }

        nav a:hover {
            background-color: #0052cc;
            color: white;
            transform: scale(1.05);
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            padding: 35px 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .container:hover { transform: scale(1.02); }

        h2 {
            text-align: center;
            color: #0052cc;
            margin-bottom: 15px;
        }

        .intro {
            margin-bottom: 15px;
            color: #555;
            line-height: 1.5;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 10px;
            font-weight: bold;
        }

        input[type="email"] {
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 15px;
            border: 2px solid #0052cc;
            font-size: 1em;
            background-color: #f0f6ff;
            transition: all 0.3s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #003d99;
            background-color: #e6f0ff;
        }

        button[type="submit"] {
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 15px;
            background-color: #0052cc;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button[type="submit"]:hover {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
            transform: scale(1.03);
        }

        .status {
            margin-top: 15px;
            color: green;
            font-size: 0.95em;
            text-align: center;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #0052cc;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            color: #003d99;
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            header h1 { font-size: 2.2em; }
            header p { font-size: 1em; }
            nav { gap: 8px; padding: 0 10px; }
            nav a { padding: 10px 12px; }
            .container { margin: 30px 12px; }
        }
    </style>
</head>
<body>
<header>
    <h1>Pete’s Pizza</h1>
    <p>Kenridge &amp; Uitzicht Branch</p>
    <p>Call Us: 021 914 3413 | 021 975 4332</p>
</header>

<nav>
    <a th:href="@{/order}">Order Online</a>
    <a th:href="@{/login}">Login</a>
    <a th:href="@{/register}">Sign Up</a>
</nav>

<main class="container" aria-labelledby="recovery-title">
    <h2 id="recovery-title">Reset your password</h2>
    <p class="intro">Enter the email address linked to your account and we'll send you a secure reset link.</p>

    <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Email Address" required autofocus>
        <button type="submit">Send reset link</button>
        <p th:if="${message}" class="status" role="status" aria-live="polite" th:text="${message}"></p>
    </form>

    <div class="login-link"><a th:href="@{/login}">Back to login</a></div>
</main>
</body>
</html>
