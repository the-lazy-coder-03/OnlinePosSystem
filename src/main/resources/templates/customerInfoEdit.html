<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Details — Pete’s Pizza</title>
    <style>
        /* =========================
           BODY & CONTAINER
        ========================= */
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #0052cc; /* blue theme */
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 { font-size: 3em; margin: 0; }
        header p { font-size: 1.2em; margin: 5px 0; }

        .main-container {
            display: flex;
            flex: 1;
            margin: 20px auto;
            max-width: 1000px;
            gap: 20px;
        }

        /* =========================
           SIDEBAR
        ========================= */
        .sidebar {
            width: 250px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: 600px;
            padding: 20px;
        }

        .sidebar h3 {
            color: #0052cc;
            margin-bottom: 15px;
        }

        .sidebar button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 15px;
            background: #f0f6ff;
            color: #0052cc;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            text-align: left;
            transition: all 0.3s;
        }

        /* Hover and active state */
        .sidebar button:hover, .sidebar button.active {
            background-color: #0052cc;
            color: white;
            border: 2px solid #7a9ac5;
        }

        /* Back button special color */
        .sidebar .back-btn {
            background: #ff9900;
            color: white;
        }

        .sidebar .back-btn:hover {
            background: white;
            color: #ff9900;
            border: 2px solid #e6a433;
        }

        /* =========================
           CONTENT AREA
        ========================= */
        .content {
            flex: 1;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            overflow-y: auto;
            max-height: 600px;
        }

        .content h2 {
            color: #0052cc;
            margin-bottom: 20px;
        }

        /* Inputs & Select */
        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border-radius: 15px;
            border: 2px solid #0052cc;
            font-size: 1em;
            box-sizing: border-box;
            background-color: #f0f6ff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #003d99;
        }

        /* Save Button */
        button.save-btn {
            background: #0052cc;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
            transition: all 0.3s;
        }

        button.save-btn:hover {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f0f6ff;
        }

        /* Message */
        .message {
            color: green;
            margin-top: 10px;
            text-align: center;
        }

        /* =========================
           TAB CONTENT
        ========================= */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

<!-- =========================
     HEADER
========================= -->
<header>
    <h1>Pete’s Pizza</h1>
    <p>Kenridge & Uitzicht Branch</p>
</header>

<!-- =========================
     MAIN CONTAINER
========================= -->
<div class="main-container">

    <!-- =========================
         SIDEBAR
    ========================= -->
    <div class="sidebar">
        <button class="back-btn" onclick="goBack()">← Back to Home</button>
        <h3>Account Menu</h3>
        <button class="tab-btn active" data-tab="profile">Edit Profile</button>
        <button class="tab-btn" data-tab="orders">Past Orders</button>
    </div>

    <!-- =========================
         CONTENT AREA
    ========================= -->
    <div class="content">

        <!-- =========================
             PROFILE TAB
        ========================= -->
        <div class="tab-content active" id="profile">
            <h2>Edit Profile</h2>
            <div th:if="${param.success}" class="message">Profile updated successfully!</div>
            <form id="profileForm" th:action="@{/profile/update}" method="post" th:object="${customer}">
                <input type="text" id="name" th:field="*{name}" placeholder="Full Name" required>
                <input type="email" id="email" th:field="*{email}" placeholder="Email Address" required readonly>
                <input type="password" id="password" name="password" placeholder="New Password (leave blank to keep current)">

                <input type="text" id="houseNumber" th:field="*{houseNumber}" placeholder="House / Apartment Number">
                <input type="text" id="complexName" th:field="*{complexName}" placeholder="Complex Name">
                <input type="text" id="street" th:field="*{street}" placeholder="Street Address">
                <input type="text" id="area" th:field="*{area}" placeholder="Area / Suburb">
                <input type="text" id="postalCode" th:field="*{postalCode}" placeholder="Postal Code">
                <input type="text" id="phone1" th:field="*{phone1}" placeholder="Phone Number" required>
                <input type="text" id="phone2" th:field="*{phone2}" placeholder="Secondary Phone Number">

                <label for="preferredStore">Preferred Store:</label>
                <select id="preferredStore" th:field="*{preferredStore}" required>
                    <option value="">Select a store</option>
                    <option value="Kenridge Branch">Kenridge Branch</option>
                    <option value="Uitzicht Branch">Uitzicht Branch</option>
                </select>

                <button type="submit" class="save-btn">Save Profile</button>
            </form>
        </div>

        <!-- =========================
             ORDERS TAB
        ========================= -->
        <div class="tab-content" id="orders">
            <h2>Past Orders</h2>
            <table>
                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total</th>
                </tr>
                </thead>
                <tbody id="ordersTable">
                <!-- Orders populate here -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- =========================
     SCRIPT
========================= -->
<script>
    let isProfileDirty = false;

    // =========================
    // BACK BUTTON
    // =========================
    function goBack() {
        if(isProfileDirty){
            if(!confirm("You have unsaved changes. Do you want to discard them and go back?")) return;
        }
        window.location.href = "/";
    }

    // =========================
    // TAB SWITCHING
    // =========================
    const tabs = document.querySelectorAll(".tab-btn");
    const contents = document.querySelectorAll(".tab-content");

    tabs.forEach(tab => {
        tab.addEventListener("click", () => {
            if(isProfileDirty){
                const proceed = confirm("You have unsaved changes. Do you want to discard them?");
                if(!proceed) return;
            }
            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            contents.forEach(c => c.classList.remove("active"));
            document.getElementById(tab.dataset.tab).classList.add("active");
            isProfileDirty = false;
        });
    });

    // =========================
    // TRACK FORM CHANGES
    // =========================
    const profileForm = document.getElementById("profileForm");
    profileForm.addEventListener("input", () => { isProfileDirty = true; });

    // =========================
    // SAVE PROFILE
    // =========================
    profileForm.addEventListener('submit', (e) => {
        isProfileDirty = false;
    });

    // =========================
    // LOAD ORDERS DATA (EXAMPLE)
    // =========================
    function loadOrders(){
        const orders = [
            {id: 101, date: "2026-01-20", items: "Pizza, Chips", total: "R250"},
            {id: 102, date: "2026-01-22", items: "Burger, Ribs", total: "R320"}
        ];
        const tbody = document.getElementById("ordersTable");
        tbody.innerHTML = "";
        orders.forEach(o => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${o.id}</td><td>${o.date}</td><td>${o.items}</td><td>${o.total}</td>`;
            tbody.appendChild(tr);
        });
    }

    // =========================
    // UNSAVED CHANGES WARNING
    // =========================
    window.addEventListener("beforeunload", (e) => {
        if(isProfileDirty){
            e.preventDefault();
            e.returnValue = '';
        }
    });

    // =========================
    // INITIALIZE PAGE
    // =========================
    loadOrders();
</script>

</body>
</html>
