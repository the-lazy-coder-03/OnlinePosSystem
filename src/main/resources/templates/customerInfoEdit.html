<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Details — Pete’s Pizza</title>
    <style>
        /* =========================
           1. BODY & CONTAINER
        ========================= */
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #0052cc;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 { font-size: 3em; margin: 0; }
        header p { font-size: 1.2em; margin: 5px 0; }

        .main-container {
            display: flex;
            flex: 1;
            margin: 20px auto;
            max-width: 1000px;
            gap: 20px;
        }

        /* =========================
           2. SIDEBAR
        ========================= */
        .sidebar {
            width: 250px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: 600px;
            padding: 20px;
        }

        .sidebar h3 {
            color: #0052cc;
            margin-bottom: 15px;
        }

        .sidebar button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 15px;
            background: #f0f6ff;
            color: #0052cc;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            text-align: left;
            transition: all 0.3s;
        }

        .sidebar button:hover, .sidebar button.active {
            background-color: #0052cc;
            color: white;
            border: 2px solid #7a9ac5;
        }

        .sidebar .back-btn {
            background: #ff9900;
            color: white;
        }

        .sidebar .back-btn:hover {
            background: white;
            color: #ff9900;
            border: 2px solid #e6a433;
        }

        /* =========================
           3. CONTENT AREA
        ========================= */
        .content {
            flex: 1;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            overflow-y: auto;
            max-height: 600px;
        }

        .content h2 {
            color: #0052cc;
            margin-bottom: 20px;
        }

        /* =========================
           3.1 INPUTS & FORM
        ========================= */
        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border-radius: 15px;
            border: 2px solid #0052cc;
            font-size: 1em;
            background-color: #f0f6ff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #003d99;
        }

        button.save-btn {
            background: #0052cc;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
            transition: all 0.3s;
        }

        button.save-btn:hover {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
        }

        /* =========================
           3.2 PAST ORDERS CARDS
        ========================= */
        .order-card {
            background: #f0f6ff;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .order-card:hover {
            transform: scale(1.02);
        }

        .order-card h3 {
            margin: 0 0 10px 0;
            color: #0052cc;
            font-size: 1.2em;
        }

        .order-card .subsection {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .order-card .subsection span.label {
            font-weight: bold;
            color: #003366;
        }

        .order-card .subsection span.value {
            color: #333;
        }

        /* =========================
           4. TAB CONTENT
        ========================= */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

    </style>
</head>
<body>

<!-- =========================
     1. HEADER
========================= -->
<header>
    <h1>Pete’s Pizza</h1>
    <p>Kenridge & Uitzicht Branch</p>
</header>

<!-- =========================
     2. MAIN CONTAINER
========================= -->
<div class="main-container">

    <!-- =========================
         2.1 SIDEBAR
    ========================= -->
    <div class="sidebar">
        <button class="back-btn" onclick="goBack()">← Back to Home</button>
        <h3>Account Menu</h3>
        <button class="tab-btn active" data-tab="profile">1. Edit Profile</button>
        <button class="tab-btn" data-tab="orders">2. Past Orders</button>
    </div>

    <!-- =========================
         3. CONTENT AREA
    ========================= -->
    <div class="content">

        <!-- =========================
             3.1 PROFILE TAB
        ========================= -->
        <div class="tab-content active" id="profile">
            <h2>1. Edit Profile</h2>
            <div th:if="${param.success}" class="message">Profile updated successfully!</div>
            <div th:if="${param.error != null and param.error[0] == 'password'}" class="message">Password must be at least 8 characters and include uppercase, lowercase, number, and special character.</div>
            <form id="profileForm" th:action="@{/profile/update}" method="post" th:object="${customer}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="firstName" th:field="*{firstName}" placeholder="First Name" required style="flex: 1;">
                    <input type="text" id="lastName" th:field="*{lastName}" placeholder="Surname" required style="flex: 1;">
                </div>
                <input type="email" id="email" th:field="*{email}" placeholder="Email Address" required readonly>
                <input type="password" id="password" name="password" minlength="8" placeholder="New Password (leave blank to keep current)">

                <input type="text" id="houseNumber" th:field="*{houseNumber}" placeholder="House / Apartment Number">
                <input type="text" id="complexName" th:field="*{complexName}" placeholder="Complex Name">
                <input type="text" id="street" th:field="*{street}" placeholder="Street Address">
                <input type="text" id="area" th:field="*{area}" placeholder="Area / Suburb">
                <input type="text" id="postalCode" th:field="*{postalCode}" placeholder="Postal Code">
                <input type="text" id="phone1" th:field="*{phone1}" placeholder="Phone Number" required>
                <input type="text" id="phone2" th:field="*{phone2}" placeholder="Secondary Phone Number">

                <label for="preferredStore">Preferred Store:</label>
                <select id="preferredStore" th:field="*{preferredStore}" required>
                    <option value="">Select a store</option>
                    <option value="Kenridge Branch">Kenridge Branch</option>
                    <option value="Uitzicht Branch">Uitzicht Branch</option>
                </select>

                <button type="submit" class="save-btn">Save Profile</button>
            </form>
        </div>

        <!-- =========================
             3.2 ORDERS TAB
        ========================= -->
        <div class="tab-content" id="orders">
            <h2>2. Past Orders</h2>
            <div id="ordersContainer">
                <!-- Orders populated here via JS -->
            </div>
        </div>

    </div>

</div>

<!-- =========================
     5. SCRIPT
========================= -->
<script>
    let isProfileDirty = false;

    // =========================
    // BACK BUTTON
    // =========================
    function goBack() {
        if(isProfileDirty){
            if(!confirm("You have unsaved changes. Do you want to discard them and go back?")) return;
        }
        window.location.href = "/";
    }

    // =========================
    // TAB SWITCHING
    // =========================
    const tabs = document.querySelectorAll(".tab-btn");
    const contents = document.querySelectorAll(".tab-content");

    tabs.forEach(tab => {
        tab.addEventListener("click", () => {
            if(isProfileDirty){
                const proceed = confirm("You have unsaved changes. Do you want to discard them?");
                if(!proceed) return;
            }
            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            contents.forEach(c => c.classList.remove("active"));
            document.getElementById(tab.dataset.tab).classList.add("active");
            isProfileDirty = false;
        });
    });

    // =========================
    // TRACK FORM CHANGES
    // =========================
    const profileForm = document.getElementById("profileForm");
    profileForm.addEventListener("input", () => { isProfileDirty = true; });

    profileForm.addEventListener('submit', () => { isProfileDirty = false; });

    // =========================
    // LOAD PAST ORDERS
    // =========================
    function loadOrders(){
        const orders = [
            {
                id: 101,
                date: "2026-01-20",
                items: [
                    {name: "Margherita Pizza", qty: 1},
                    {name: "Garlic Bread", qty: 2}
                ],
                total: "R250"
            },
            {
                id: 102,
                date: "2026-01-22",
                items: [
                    {name: "Pepperoni Pizza", qty: 1},
                    {name: "Coke", qty: 2}
                ],
                total: "R320"
            }
        ];

        const container = document.getElementById("ordersContainer");
        container.innerHTML = "";

        orders.forEach((order, index) => {
            const card = document.createElement("div");
            card.classList.add("order-card");

            // Order Header
            const header = document.createElement("h3");
            header.textContent = `${index + 1}. Order #${order.id}`;
            card.appendChild(header);

            // Subsection: Date
            const dateSection = document.createElement("div");
            dateSection.classList.add("subsection");
            dateSection.innerHTML = `<span class="label">Date:</span> <span class="value">${order.date}</span>`;
            card.appendChild(dateSection);

            // Subsection: Items
            const itemsSection = document.createElement("div");
            itemsSection.classList.add("subsection");
            itemsSection.innerHTML = `<span class="label">Items:</span> <span class="value">${order.items.map(i=>`${i.qty} x ${i.name}`).join(", ")}</span>`;
            card.appendChild(itemsSection);

            // Subsection: Total
            const totalSection = document.createElement("div");
            totalSection.classList.add("subsection");
            totalSection.innerHTML = `<span class="label">Total:</span> <span class="value">${order.total}</span>`;
            card.appendChild(totalSection);

            container.appendChild(card);
        });
    }

    window.addEventListener("beforeunload", (e) => {
        if(isProfileDirty){
            e.preventDefault();
            e.returnValue = '';
        }
    });

    loadOrders();
</script>

</body>
</html>
