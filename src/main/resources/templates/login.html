<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pete’s Pizza | Edit Profile</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TOP SPACE */
        .top-space {
            height: 80px; /* Blank space at top */
        }

        /* BRAND */
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 3em;
            color: #3366ff;
        }

        .brand p {
            font-size: 1.2em;
            color: #555;
        }

        /* PROFILE CARD */
        .profile-container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .profile-container h2 {
            text-align: center;
            color: #3366ff;
            margin-bottom: 20px;
        }

        /* INPUTS */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3366ff;
        }

        /* BUTTON */
        .save-btn {
            width: 100%;
            height: 45px;
            background-color: #3366ff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }

        .save-btn:hover {
            background-color: #254eda;
        }

        /* MESSAGE */
        .message {
            color: green;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="top-space"></div> <!-- blank top column -->

<!-- BRAND BANNER -->
<div class="brand">
    <h1>Pete’s Pizza</h1>
    <p>Kenridge & Uitzicht</p>
</div>

<!-- PROFILE CARD -->
<div class="profile-container">
    <h2>Edit Profile</h2>

    <form id="profileForm">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>Phone 1</label>
            <input type="text" id="phone1" required>
        </div>
        <div class="form-group">
            <label>Phone 2</label>
            <input type="text" id="phone2">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>House Number</label>
            <input type="text" id="houseNumber">
        </div>
        <div class="form-group">
            <label>Street</label>
            <input type="text" id="street">
        </div>
        <div class="form-group">
            <label>Area</label>
            <input type="text" id="area">
        </div>
        <div class="form-group">
            <label>Complex Name</label>
            <input type="text" id="complexName">
        </div>
        <div class="form-group">
            <label>Preferred Store</label>
            <input type="text" id="preferredStore">
        </div>
        <div class="form-group">
            <label>City</label>
            <input type="text" id="city">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
        </div>
        <div class="form-group">
            <label>Postal Code</label>
            <input type="text" id="postalCode">
        </div>

        <button type="submit" class="save-btn">Save Profile</button>
        <div class="message" id="message"></div>
    </form>
</div>

<script>
    const customerId = 1; // replace with dynamic id
    const apiUrl = `http://localhost:8080/api/customers/${customerId}`;

    async function loadProfile() {
        try {
            const res = await fetch(apiUrl);
            const data = await res.json();
            document.getElementById('name').value = data.name;
            document.getElementById('phone1').value = data.phone1;
            document.getElementById('phone2').value = data.phone2;
            document.getElementById('email').value = data.email;
            document.getElementById('houseNumber').value = data.houseNumber;
            document.getElementById('street').value = data.street;
            document.getElementById('area').value = data.area;
            document.getElementById('complexName').value = data.complexName;
            document.getElementById('preferredStore').value = data.preferredStore;
            document.getElementById('city').value = data.city;
            document.getElementById('password').value = data.password;
            document.getElementById('postalCode').value = data.postalCode;
        } catch(err) {
            console.error('Error loading profile:', err);
        }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('name').value,
            phone1: document.getElementById('phone1').value,
            phone2: document.getElementById('phone2').value,
            email: document.getElementById('email').value,
            houseNumber: document.getElementById('houseNumber').value,
            street: document.getElementById('street').value,
            area: document.getElementById('area').value,
            complexName: document.getElementById('complexName').value,
            preferredStore: document.getElementById('preferredStore').value,
            city: document.getElementById('city').value,
            password: document.getElementById('password').value,
            postalCode: document.getElementById('postalCode').value
        };

        try {
            const res = await fetch(apiUrl, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                document.getElementById('message').textContent = 'Profile saved successfully!';
                setTimeout(() => { document.getElementById('message').textContent = ''; }, 3000);
            }
        } catch(err) {
            console.error('Error saving profile:', err);
        }
    });

    loadProfile();
</script>

</body>
</html>
