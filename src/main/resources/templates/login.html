<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pete’s Pizza | Login</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* PAGE WRAPPER */
        .page-container {
            text-align: center;
        }

        /* BRAND */
        .brand {
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 3em;
            color: #3366ff;
        }

        .brand p {
            color: #555;
            font-size: 1.1em;
        }

        /* LOGIN CARD */
        .login-container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .login-container h2 {
            text-align: center;
            color: #3366ff;
            margin-bottom: 20px;
        }

        /* INPUTS */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3366ff;
        }

        /* BUTTON */
        .login-btn {
            width: 100%;
            height: 45px;
            background-color: #3366ff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #254eda;
        }

        /* ERROR MESSAGE */
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
        }

        /* LOGOUT MESSAGE */
        .logout {
            color: green;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
        }

        /* EXTRA LINKS */
        .extra-links {
            margin-top: 15px;
            text-align: center;
        }

        .extra-links a {
            color: #3366ff;
            text-decoration: none;
            font-weight: bold;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="page-container">

    <!-- BRAND HEADER -->
    <div class="brand">
        <h1>Pete’s Pizza</h1>
        <p>Kenridge & Uitzicht</p>
    </div>

    <!-- LOGIN CARD -->
    <div class="login-container">
        <h2>Login</h2>

        <!-- SPRING SECURITY LOGIN FORM -->
        <form th:action="@{/login}" method="post">

            <!-- CSRF TOKEN (REQUIRED) -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username">Email or Phone Number</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter email or phone number"
                       required
                       autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">Login</button>

            <!-- ERROR / LOGOUT MESSAGES -->
            <div th:if="${param.error}" class="error">
                Invalid email or password
            </div>

            <div th:if="${param.logout}" class="logout">
                You have been logged out
            </div>

        </form>

        <!-- EXTRA LINKS -->
        <div class="extra-links">
            <p>Don’t have an account? <a th:href="@{/register}">Sign up</a></p>
        </div>
    </div>

</div>

</body>
</html>
