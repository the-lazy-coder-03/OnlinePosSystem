<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pete’s Pizza | Login</title>

    <style>
        /* =========================
           GLOBAL STYLES
        ========================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           PAGE CONTAINER
        ========================= */
        .page-container {
            text-align: center;
        }

        /* =========================
           BRANDING
        ========================= */
        .brand {
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 3em;
            color: #0052cc; /* updated blue theme */
        }

        .brand p {
            color: #555;
            font-size: 1.1em;
        }

        /* =========================
           LOGIN BOX
        ========================= */
        .login-container {
            background: white;
            padding: 40px 30px;
            width: 380px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .login-container:hover {
            transform: scale(1.02);
        }

        .login-container h2 {
            text-align: center;
            color: #0052cc;
            margin-bottom: 25px;
        }

        /* =========================
           FORM FIELDS
        ========================= */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
        .form-group input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border-radius: 15px; /* rounded like order page */
            border: 2px solid #0052cc;
            font-size: 1em;
            background-color: #f0f6ff;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #003d99;
            background-color: #e6f0ff;
        }

        /* =========================
           LOGIN BUTTON
        ========================= */
        .login-btn {
            width: 100%;
            height: 50px;
            background-color: #0052cc;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .login-btn:hover {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
            transform: scale(1.03);
        }

        /* =========================
           ERROR & LOGOUT MESSAGES
        ========================= */
        .error {
            color: red;
            font-size: 0.95em;
            margin-top: 10px;
            text-align: center;
        }

        .logout {
            color: green;
            font-size: 0.95em;
            margin-top: 10px;
            text-align: center;
        }

        /* =========================
           EXTRA LINKS
        ========================= */
        .extra-links {
            margin-top: 20px;
            text-align: center;
        }

        .extra-links a {
            color: #0052cc;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .extra-links a:hover {
            text-decoration: underline;
            color: #003d99;
        }
    </style>
</head>

<body>

<!-- =========================
     PAGE CONTAINER
========================= -->
<div class="page-container">

    <!-- =========================
         BRANDING
    ========================= -->
    <div class="brand">
        <h1>Pete’s Pizza</h1>
        <p>Kenridge & Uitzicht</p>
    </div>

    <!-- =========================
         LOGIN FORM
    ========================= -->
    <div class="login-container">
        <h2>Login</h2>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">Login</button>

            <div th:if="${param.error}" class="error">Invalid email or password</div>
            <div th:if="${param.logout}" class="logout">You have been logged out</div>
        </form>

        <!-- =========================
             EXTRA LINKS
        ========================= -->
        <div class="extra-links">
            <p>Don’t have an account? <a th:href="@{/register}">Sign up</a></p>
        </div>
    </div>

</div>

</body>
</html>
