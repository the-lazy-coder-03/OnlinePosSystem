<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pete’s Pizza | Login</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* PAGE WRAPPER */
        .page-container {
            text-align: center;
        }

        /* BRAND */
        .brand {
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 3em;
            color: #3366ff;
        }

        .brand p {
            color: #555;
            font-size: 1.1em;
        }

        /* LOGIN CARD */
        .login-container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .login-container h2 {
            text-align: center;
            color: #3366ff;
            margin-bottom: 20px;
        }

        /* INPUTS */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3366ff;
        }

        /* BUTTON */
        .login-btn {
            width: 100%;
            height: 45px;
            background-color: #3366ff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #254eda;
        }

        /* ERROR MESSAGE */
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        /* EXTRA LINKS */
        .extra-links {
            margin-top: 15px;
            text-align: center;
        }

        .extra-links a {
            color: #3366ff;
            text-decoration: none;
            font-weight: bold;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="page-container">

    <!-- BRAND HEADER -->
    <div class="brand">
        <h1>Pete’s Pizza</h1>
        <p>Kenridge & Uitzicht</p>
    </div>

    <!-- LOGIN CARD -->
    <div class="login-container">
        <h2>Login</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Email or Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <div class="error" id="errorMsg">
                Invalid username or password
            </div>
        </form>

        <div class="extra-links">
            <p>Don’t have an account?
                <a href="/register">Sign up</a>
            </p>
        </div>
    </div>

</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("errorMsg");

        if (!username || !password) {
            errorMsg.textContent = "Please fill in all fields";
            errorMsg.style.display = "block";
            return;
        }

        // Demo login logic (replace with backend)
        if (username === "admin" && password === "admin123") {
            window.location.href = "/";
        } else {
            errorMsg.textContent = "Invalid username or password";
            errorMsg.style.display = "block";
        }
    });
</script>

</body>
</html>
