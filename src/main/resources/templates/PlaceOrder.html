<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #0052cc;
            margin-bottom: 20px;
        }

        .option-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .option, button, .back-button {
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background-color: #0052cc;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }

        /* Hover effect */
        .option:hover, button:hover, .back-button:hover {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
            transform: scale(1.05);
        }

        select {
            display: none;
            margin-top: 20px;
            padding: 18px;
            font-size: 1.2em;
            border-radius: 15px;
            border: 2px solid #0052cc;
            background-color: #f0f6ff;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #003d99;
        }

        .hidden {
            display: none;
        }

        /* Step 3 buttons grid for Back & Next */
        #timeButtonsGrid {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        #timeButtonsGrid button {
            flex: 1;
        }
    </style>
</head>
<body>

<div style="padding: 10px; background-color: #cce0ff; text-align: center; font-weight: bold;" th:if="${customerName != null}">
    Ordering as: <span th:text="${customerName}">User</span>
</div>

<div class="container">
    <!-- Step 1: Branch -->
    <div id="step1">
        <h2>Choose Branch</h2>
        <div class="option-grid">
            <div class="option" onclick="nextStep('kenridge', 'branch')">Kenridge</div>
            <div class="option" onclick="nextStep('uitzicht', 'branch')">Uitzicht</div>
        </div>
    </div>

    <!-- Step 2: Pickup or Delivery -->
    <div id="step2" class="hidden">
        <h2>Choose Order Type</h2>
        <div class="option-grid">
            <div class="option" onclick="nextStep('pickup', 'type')">Pickup</div>
            <div class="option" onclick="nextStep('delivery', 'type')">Delivery</div>
        </div>
        <!-- Fixed back button: same style as option blocks -->
        <div style="margin-top: 20px;">
            <button class="back-button option" onclick="goBack('step2')">Back</button>
        </div>
    </div>


    <!-- Step 3: Time -->
    <div id="step3" class="hidden">
        <h2>Choose Time</h2>
        <div class="option-grid" id="timeOptionsGrid">
            <div class="option" onclick="selectTime('Now')">Now</div>
            <div class="option" onclick="showLaterDropdown()">Later</div>
        </div>

        <select id="timeDropdown"></select>

        <div id="timeButtonsGrid">
            <button onclick="confirmLaterTime()">Next</button>
            <button class="back-button" onclick="goBack('step3')">Back</button>
        </div>
    </div>

    <!-- Step 4: Summary -->
    <div id="step4" class="hidden">
        <h2>Order Summary</h2>
        <p id="summary"></p>
        <div class="option-grid">
            <button onclick="placeOrder()">Place Order</button>
            <button onclick="startOver()">Start Over</button>
            <button class="back-button" onclick="goBack('step4')">Back</button>
        </div>
    </div>
</div>

<script>
    const orderData = { branch: '', type: '', time: '' };

    function placeOrder() {
        alert("Order placed successfully!");
        window.location.href = "/";
    }

    // Step navigation
    function nextStep(choice, step) {
        orderData[step] = choice;
        if(step === 'branch'){
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        } else if(step === 'type'){
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            document.getElementById('timeDropdown').style.display = 'none';
            document.getElementById('timeButtonsGrid').style.display = 'none';
        }
    }

    // Go back
    function goBack(step){
        if(step==='step2'){
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
            orderData.type='';
        } else if(step==='step3'){
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            orderData.time='';
            document.getElementById('timeDropdown').style.display='none';
            document.getElementById('timeButtonsGrid').style.display='none';
        } else if(step==='step4'){
            document.getElementById('step4').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        }
    }

    // Time selection
    function selectTime(choice){
        orderData.time = choice;
        if(choice === 'Now'){
            showSummary();
        }
    }

    // Show Later dropdown
    function showLaterDropdown(){
        const dropdown = document.getElementById('timeDropdown');
        dropdown.innerHTML = '';
        let start = 17*60;
        const end = 21*60;
        while(start <= end){
            const h = Math.floor(start/60);
            const m = start % 60;
            const timeStr = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            const option = document.createElement('option');
            option.value = timeStr;
            option.text = timeStr;
            dropdown.add(option);
            start+=15;
        }
        dropdown.style.display='block';
        document.getElementById('timeButtonsGrid').style.display='flex';
    }

    // Confirm Later
    function confirmLaterTime(){
        const dropdown = document.getElementById('timeDropdown');
        if(!dropdown.value){ alert('Please select a time'); return; }
        orderData.time = dropdown.value;
        showSummary();
    }

    // Summary
    function showSummary(){
        document.getElementById('step3').classList.add('hidden');
        document.getElementById('step4').classList.remove('hidden');
        document.getElementById('summary').innerText =
            `Branch: ${orderData.branch}\nOrder Type: ${orderData.type}\nTime: ${orderData.time}`;
    }

    // Start over
    function startOver(){
        orderData.branch='';
        orderData.type='';
        orderData.time='';
        document.getElementById('step4').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
        document.getElementById('timeDropdown').style.display='none';
        document.getElementById('timeButtonsGrid').style.display='none';
    }
</script>
</body>
</html>
