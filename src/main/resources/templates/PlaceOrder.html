<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>
    <style>
        :root {
            --primary-color: #0052cc;
            --secondary-color: #f0f6ff;
            --text-color: #333;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e6f0ff;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        h2, h3 {
            color: var(--primary-color);
        }

        .hidden { display: none !important; }

        /* Step Styles */
        .step-container {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 20px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.3s;
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        /* Menu Layout */
        .menu-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .side-tabs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tab {
            padding: 15px;
            background: var(--secondary-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            border: 2px solid transparent;
        }

        .tab.active {
            border-color: var(--primary-color);
            background: var(--white);
            color: var(--primary-color);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .item-card {
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow);
        }

        .item-card.selected {
            background-color: var(--secondary-color);
            border-color: var(--primary-color);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: var(--white);
            margin: 5% auto;
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .close {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .custom-section {
            margin-bottom: 20px;
        }

        .custom-section h4 {
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .option-card {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }

        .option-card.selected {
            background-color: var(--secondary-color);
            border-color: var(--primary-color);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-desc {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        /* Customization Modal-like view */
        .customization {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            font-size: 0.85em;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        /* Summary */
        .summary-card {
            background: var(--secondary-color);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-top: 20px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .total-row {
            border-top: 2px solid var(--primary-color);
            padding-top: 10px;
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
        }

        .footer-btns {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .footer-btns .btn { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <!-- Step 1: Branch Selection -->
    <div id="step-branch" class="step-container">
        <h2>Welcome</h2>
        <p>Please select a branch to view the menu and prices.</p>
        <div class="btn-grid">
            <button class="btn" onclick="selectBranch('Branch A')">Branch A</button>
            <button class="btn" onclick="selectBranch('Branch B')">Branch B</button>
        </div>
    </div>

    <!-- Step 2: Menu Selection -->
    <div id="step-menu" class="step-container hidden">
        <h2 id="menu-title">Menu</h2>
        <div class="menu-layout">
            <div id="side-tabs" class="side-tabs">
                <!-- Tabs will be injected here -->
            </div>
            <div id="items-container">
                <div id="items-grid" class="items-grid">
                    <!-- Items will be injected here -->
                </div>
            </div>
        </div>
        <div class="footer-btns">
            <button class="btn btn-secondary" onclick="showStep('branch')">Back</button>
            <button class="btn" onclick="showSummary()">View Summary & Total</button>
        </div>
    </div>

    <!-- Step 3: Summary -->
    <div id="step-summary" class="step-container hidden">
        <h2>Order Summary</h2>
        <div id="summary-content" class="summary-card">
            <!-- Summary will be injected here -->
        </div>
        <div class="footer-btns">
            <button class="btn btn-secondary" onclick="showStep('menu')">Back to Menu</button>
            <button class="btn" onclick="placeOrder()">Confirm & Place Order</button>
        </div>
    </div>

    <!-- Customization Modal -->
    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-item-name">Customize Pizza</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modal-body">
                <!-- Size Selection -->
                <div class="custom-section">
                    <h4>Choose Size</h4>
                    <div id="modal-sizes" class="option-grid"></div>
                </div>
                <!-- Toppings Selection -->
                <div class="custom-section">
                    <h4>Add Extra Toppings</h4>
                    <div id="modal-toppings" class="option-grid"></div>
                </div>
            </div>
            <div class="footer-btns">
                <button class="btn" onclick="addCustomizedToCart()">Add to Order</button>
            </div>
        </div>
    </div>
</div>

<!-- Thymeleaf variables for JS -->
<script th:inline="javascript">
    /*[+
    const currentUser = [[${user}]];
    const customerId = currentUser ? currentUser.id : 1; // Default to 1 for demo if no user
    +]*/
</script>

<script>
    let state = {
        branch: '',
        type: 'Pickup', // Default order type
        menu: [], // Full menu fetched from API
        categories: [],
        selectedCategory: '',
        cart: {}, // menuItemId-sizeId-toppingsHash -> { item, size, quantity, toppings: [] }
        currentCustomizing: null // { item, size, toppings: [] }
    };

    function selectBranch(branchName) {
        state.branch = branchName;
        document.getElementById('menu-title').innerText = branchName + ' Menu';
        fetchMenu(branchName);
    }

    async function fetchMenu(branch) {
        try {
            console.log('Fetching menu for branch:', branch);
            const response = await fetch(`/api/orders/menu?branch=${branch}`);
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
            }
            const data = await response.json();
            console.log('Menu data received:', data);
            
            if (!data || data.length === 0) {
                alert('No menu items found for this branch.');
                return;
            }

            state.menu = data;
            
            // Extract unique categories
            state.categories = [...new Set(data.map(item => item.categoryName))];
            state.selectedCategory = state.categories[0];
            
            renderTabs();
            renderItems();
            showStep('menu');
        } catch (error) {
            console.error('Error fetching menu:', error);
            alert('Failed to load menu: ' + error.message);
        }
    }

    function renderTabs() {
        const container = document.getElementById('side-tabs');
        container.innerHTML = state.categories.map(cat => `
            <div class="tab ${cat === state.selectedCategory ? 'active' : ''}" 
                 onclick="selectCategory('${cat}')">${cat}</div>
        `).join('');
    }

    function selectCategory(cat) {
        state.selectedCategory = cat;
        renderTabs();
        renderItems();
    }

    function renderItems() {
        const grid = document.getElementById('items-grid');
        const items = state.menu.filter(i => i.categoryName === state.selectedCategory);
        
        grid.innerHTML = items.map(item => {
            const minPrice = Math.min(...item.availableSizes.map(s => s.price));
            return `
                <div class="item-card" onclick="openCustomization(${item.menuItemId})">
                    <div class="item-header">
                        <span>${item.menuItemName}</span>
                        <span>From R${minPrice.toFixed(2)}</span>
                    </div>
                    <div class="item-desc">${item.description || ''}</div>
                    <div style="color: var(--primary-color); font-weight: 600; font-size: 0.9em; margin-top: 10px;">
                        Click to customize & add
                    </div>
                </div>
            `;
        }).join('');
    }

    function openCustomization(menuItemId) {
        const item = state.menu.find(i => i.menuItemId === menuItemId);
        state.currentCustomizing = {
            item: item,
            size: item.availableSizes[0],
            toppings: []
        };

        document.getElementById('modal-item-name').innerText = `Customize ${item.menuItemName}`;
        renderModalOptions();
        document.getElementById('custom-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('custom-modal').style.display = 'none';
        state.currentCustomizing = null;
    }

    function renderModalOptions() {
        const sizeContainer = document.getElementById('modal-sizes');
        const toppingContainer = document.getElementById('modal-toppings');
        const { item, size: selectedSize, toppings: selectedToppings } = state.currentCustomizing;

        sizeContainer.innerHTML = item.availableSizes.map(s => `
            <div class="option-card ${s.sizeId === selectedSize.sizeId ? 'selected' : ''}" 
                 onclick="selectSize(${s.sizeId})">
                ${s.cm}cm<br>R${s.price.toFixed(2)}
            </div>
        `).join('');

        if (item.availableToppings && item.availableToppings.length > 0) {
            toppingContainer.innerHTML = item.availableToppings.map(t => {
                const extraPriceObj = t.extraPrices.find(ep => ep.sizeId === selectedSize.sizeId);
                const price = extraPriceObj ? extraPriceObj.price : 0;
                const isSelected = selectedToppings.some(st => st.id === t.id);
                return `
                    <div class="option-card ${isSelected ? 'selected' : ''}" 
                         onclick="toggleTopping(${t.id})">
                        ${t.name}<br>+R${price.toFixed(2)}
                    </div>
                `;
            }).join('');
        } else {
            toppingContainer.innerHTML = '<p>No extra toppings available for this item.</p>';
        }
    }

    function selectSize(sizeId) {
        const size = state.currentCustomizing.item.availableSizes.find(s => s.sizeId === sizeId);
        state.currentCustomizing.size = size;
        renderModalOptions();
    }

    function toggleTopping(toppingId) {
        const topping = state.currentCustomizing.item.availableToppings.find(t => t.id === toppingId);
        const index = state.currentCustomizing.toppings.findIndex(st => st.id === toppingId);
        
        if (index > -1) {
            state.currentCustomizing.toppings.splice(index, 1);
        } else {
            state.currentCustomizing.toppings.push(topping);
        }
        renderModalOptions();
    }

    function addCustomizedToCart() {
        const { item, size, toppings } = state.currentCustomizing;
        
        // Create a unique key based on item, size and toppings
        const toppingIds = toppings.map(t => t.id).sort().join(',');
        const cartKey = `${item.menuItemId}-${size.sizeId}-${toppingIds}`;

        if (state.cart[cartKey]) {
            state.cart[cartKey].quantity++;
        } else {
            state.cart[cartKey] = {
                item: item,
                size: size,
                toppings: [...toppings],
                quantity: 1
            };
        }
        
        alert(`${item.menuItemName} added to order!`);
        closeModal();
    }

    function showStep(stepId) {
        document.querySelectorAll('.step-container').forEach(el => el.classList.add('hidden'));
        const target = document.getElementById('step-' + stepId);
        if (target) {
            target.classList.remove('hidden');
        } else {
            console.error('Step not found:', stepId);
        }
    }

    function showSummary() {
        const content = document.getElementById('summary-content');
        const cartEntries = Object.entries(state.cart);
        
        if (cartEntries.length === 0) {
            alert('Your cart is empty!');
            return;
        }

        let total = 0;
        let html = `<h3>Order for ${state.branch}</h3>`;
        
        cartEntries.forEach(([key, entry]) => {
            let itemPrice = entry.size.price;
            let toppingsList = "";
            
            if (entry.toppings && entry.toppings.length > 0) {
                const toppingNames = [];
                entry.toppings.forEach(t => {
                    const extraPriceObj = t.extraPrices.find(ep => ep.sizeId === entry.size.sizeId);
                    const price = extraPriceObj ? extraPriceObj.price : 0;
                    itemPrice += price;
                    toppingNames.push(`${t.name} (R${price.toFixed(2)})`);
                });
                toppingsList = `<div style="font-size: 0.8em; color: #666; margin-left: 20px;">+ ${toppingNames.join(', ')}</div>`;
            }

            const lineTotal = itemPrice * entry.quantity;
            total += lineTotal;
            
            html += `
                <div style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px;">
                    <div class="summary-item">
                        <span><strong>${entry.quantity}x ${entry.item.menuItemName} (${entry.size.cm}cm)</strong></span>
                        <span>R${lineTotal.toFixed(2)}</span>
                    </div>
                    ${toppingsList}
                </div>
            `;
        });

        html += `<div class="total-row">
                    <span>Total Amount</span>
                    <span>R${total.toFixed(2)}</span>
                 </div>`;
        
        content.innerHTML = html;
        showStep('summary');
    }

    async function placeOrder() {
        const items = Object.entries(state.cart).map(([key, entry]) => {
            const extras = entry.toppings.map(t => ({
                ingredientId: t.id,
                quantity: 1
            }));

            return {
                pizzaId: parseInt(entry.item.menuItemId),
                pizzaSizeId: entry.size.sizeId,
                quantity: entry.quantity,
                extras: extras,
                notes: ''
            };
        });

        const request = {
            customerName: typeof currentUser !== 'undefined' && currentUser ? currentUser.firstName + ' ' + currentUser.lastName : 'Guest User',
            phone: typeof currentUser !== 'undefined' && currentUser ? currentUser.phone1 : '0000000000',
            branchName: state.branch,
            orderType: state.type.toLowerCase(),
            items: items
        };

        try {
            const response = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(request)
            });
            
            if (response.ok) {
                const order = await response.json();
                alert(`Order placed successfully! Order ID: ${order.id}`);
                window.location.href = '/';
            } else {
                const error = await response.text();
                alert('Failed to place order: ' + error);
            }
        } catch (error) {
            console.error('Error placing order:', error);
            alert('An error occurred. Please try again.');
        }
    }

</script>

</body>
</html>
