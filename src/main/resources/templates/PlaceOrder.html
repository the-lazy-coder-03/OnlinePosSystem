<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>
    <style>
        :root {
            --primary-color: #0052cc;
            --secondary-color: #f0f6ff;
            --text-color: #333;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        h2, h3 { color: var(--primary-color); }

        .hidden { display: none !important; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 25px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: 0.3s;
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-secondary { background-color: #6c757d; }

        .menu-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .side-tabs { display: flex; flex-direction: column; gap: 10px; }
        .tab {
            padding: 15px;
            background: var(--secondary-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            border: 2px solid transparent;
        }
        .tab.active {
            border-color: var(--primary-color);
            background: var(--white);
            color: var(--primary-color);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .item-card {
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .item-card:hover { border-color: var(--primary-color); box-shadow: var(--shadow); }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: var(--white);
            margin: 5% auto;
            padding: 25px;
            border-radius: 20px;
            width: 80%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; }

        .custom-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .summary-card {
            background: var(--secondary-color);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-top: 20px;
        }
        .total-row {
            border-top: 2px solid var(--primary-color);
            padding-top: 10px;
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Step 1: Branch Selection -->
    <div id="step-branch">
        <h2>Select Branch</h2>
        <p>Please select your branch to see the correct menu and prices.</p>
        <div class="btn-grid">
            <button class="btn" onclick="selectBranch('Kenridge')">Kenridge</button>
            <button class="btn" onclick="selectBranch('Uitzicht')">Uitzicht</button>
        </div>
    </div>

    <!-- Step 2: Menu -->
    <div id="step-menu" class="hidden">
        <h2 id="menu-title">Menu</h2>
        <div class="menu-layout">
            <div id="side-tabs" class="side-tabs"></div>
            <div id="items-grid" class="items-grid"></div>
        </div>
        <div style="margin-top: 30px; display: flex; gap: 15px;">
            <button class="btn btn-secondary" onclick="showStep('branch')">Back</button>
            <button class="btn" onclick="showSummary()">View Cart & Total</button>
        </div>
    </div>

    <!-- Step 3: Summary -->
    <div id="step-summary" class="hidden">
        <h2>Order Summary</h2>
        <div id="summary-content" class="summary-card"></div>
        <div style="margin-top: 30px; display: flex; gap: 15px;">
            <button class="btn btn-secondary" onclick="showStep('menu')">Back to Menu</button>
            <button class="btn" onclick="placeOrder()">Confirm Order</button>
        </div>
    </div>

    <!-- Customization Modal -->
    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modal-title">Customize</h3>
            <div id="modal-options"></div>
            <button class="btn" style="width: 100%; margin-top: 20px;" onclick="addToCart()">Add to Order</button>
        </div>
    </div>
</div>

<script>
    let state = {
        branch: '',
        menu: [],
        categories: [],
        selectedCategory: '',
        cart: [],
        currentCustomizing: null
    };

    function showStep(stepId) {
        ['step-branch', 'step-menu', 'step-summary'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById('step-' + stepId).classList.remove('hidden');
    }

    async function selectBranch(branchName) {
        state.branch = branchName;
        document.getElementById('menu-title').innerText = branchName + ' Menu';
        await fetchMenu(branchName);
        showStep('menu');
    }

    async function fetchMenu(branch) {
        const res = await fetch(`/api/orders/menu?branch=${branch}`);
        state.menu = await res.json();
        state.categories = [...new Set(state.menu.map(i => i.categoryName))];
        state.selectedCategory = state.categories[0];
        renderTabs();
        renderItems();
    }

    function renderTabs() {
        const container = document.getElementById('side-tabs');
        container.innerHTML = state.categories.map(cat => `
            <div class="tab ${cat === state.selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
                ${cat}
            </div>
        `).join('');
    }

    function selectCategory(cat) {
        state.selectedCategory = cat;
        renderTabs();
        renderItems();
    }

    function renderItems() {
        const grid = document.getElementById('items-grid');
        const items = state.menu.filter(i => i.categoryName === state.selectedCategory);
        grid.innerHTML = items.map(item => `
            <div class="item-card" onclick="openCustomization(${item.menuItemId}, ${item.pizza}, ${item.pizzaSizeId || 0}, ${item.price})">
                <div style="font-weight: bold; display: flex; justify-content: space-between;">
                    <span>${item.menuItemName}</span>
                    <span>R${item.price.toFixed(2)}</span>
                </div>
                <p style="font-size: 0.9em; color: #666;">${item.description || ''}</p>
                <p style="color: var(--primary-color); font-weight: 600; font-size: 0.8em;">Click to add</p>
            </div>
        `).join('');
    }

    function openCustomization(id, isPizza, pizzaSizeId, price) {
        const item = state.menu.find(i => i.menuItemId === id && i.isPizza === isPizza && (i.pizzaSizeId || 0) === pizzaSizeId);
        state.currentCustomizing = {
            item: item,
            selectedCustoms: item.customizations.filter(c => c.default).map(c => c.id)
        };
        
        const optionsDiv = document.getElementById('modal-options');
        if (item.customizations.length === 0) {
            optionsDiv.innerHTML = '<p>No customizations available.</p>';
        } else {
            optionsDiv.innerHTML = item.customizations.map(c => `
                <div class="custom-item">
                    <span>${c.name} (R${c.price.toFixed(2)})</span>
                    <input type="checkbox" ${c.default ? 'checked' : ''} onchange="toggleCustom(${c.id}, this.checked)">
                </div>
            `).join('');
        }
        
        document.getElementById('modal-title').innerText = 'Customize ' + item.menuItemName;
        document.getElementById('custom-modal').style.display = 'block';
    }

    function toggleCustom(id, checked) {
        if (checked) {
            if (!state.currentCustomizing.selectedCustoms.includes(id)) 
                state.currentCustomizing.selectedCustoms.push(id);
        } else {
            state.currentCustomizing.selectedCustoms = state.currentCustomizing.selectedCustoms.filter(cid => cid !== id);
        }
    }

    function closeModal() {
        document.getElementById('custom-modal').style.display = 'none';
    }

    function addToCart() {
        const { item, selectedCustoms } = state.currentCustomizing;
        state.cart.push({
            item: item,
            customs: item.customizations.filter(c => selectedCustoms.includes(c.id)),
            quantity: 1
        });
        alert(item.menuItemName + ' added to cart!');
        closeModal();
    }

    function showSummary() {
        if (state.cart.length === 0) return alert('Cart is empty');
        
        const content = document.getElementById('summary-content');
        let total = 0;
        let html = `<h3>Order for ${state.branch}</h3>`;
        
        state.cart.forEach(entry => {
            let itemTotal = entry.item.price;
            let customNames = entry.customs.map(c => {
                itemTotal += c.price;
                return c.name;
            }).join(', ');
            
            total += itemTotal;
            html += `
                <div style="margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 5px;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold;">
                        <span>1x ${entry.item.menuItemName}</span>
                        <span>R${itemTotal.toFixed(2)}</span>
                    </div>
                    ${customNames ? `<div style="font-size: 0.85em; color: #666; margin-left: 15px;">+ ${customNames}</div>` : ''}
                </div>
            `;
        });
        
        html += `<div class="total-row"><span>Total</span><span>R${total.toFixed(2)}</span></div>`;
        content.innerHTML = html;
        showStep('summary');
    }

    async function placeOrder() {
        const items = state.cart.map(entry => ({
            menuItemId: entry.item.isPizza ? null : entry.item.menuItemId,
            pizzaId: entry.item.isPizza ? entry.item.menuItemId : null,
            pizzaSizeId: entry.item.isPizza ? entry.item.pizzaSizeId : null,
            quantity: entry.quantity,
            customizations: entry.customs.map(c => ({ id: c.id, quantity: 1 }))
        }));

        const request = {
            branchName: state.branch,
            items: items,
            customerName: 'Guest User',
            orderType: 'pickup'
        };

        const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(request)
        });

        if (res.ok) {
            alert('Order placed successfully!');
            location.reload();
        } else {
            alert('Failed to place order');
        }
    }
</script>

</body>
</html>
