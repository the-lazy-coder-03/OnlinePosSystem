<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            color: #0052cc;
            margin-bottom: 20px;
        }

        .option-grid {
            display: grid;
            gap: 20px;
        }

        .option, button, .back-button {
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background-color: #0052cc;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .option:hover, button:hover, .back-button:hover {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
            transform: scale(1.05);
        }

        select {
            display: none;
            margin-top: 20px;
            padding: 18px;
            font-size: 1.2em;
            border-radius: 15px;
            border: 2px solid #0052cc;
            background-color: #f0f6ff;
            width: 100%;
            text-align: center;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #003d99;
        }

        .hidden { display: none; }

        #timeButtonsGrid {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        #timeButtonsGrid button { flex: 1; }

        /* Side Profile Menu for Step 4 */
        .order-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .side-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 150px;
        }

        .section-option {
            padding: 15px;
            border-radius: 10px;
            background-color: #0052cc;
            color: white;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .section-option:hover, .section-option.active {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
        }

        .section-content {
            flex: 1;
            background-color: #f0f6ff;
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
        }

        .item-card {
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            background-color: #0052cc;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .item-card:hover {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Step 1: Branch -->
    <div id="step1">
        <h2>Choose Branch</h2>
        <div class="option-grid">
            <div class="option" onclick="nextStep('Kenridge', 'branch')">Kenridge</div>
            <div class="option" onclick="nextStep('Uitzicht', 'branch')">Uitzicht</div>
        </div>
    </div>

    <!-- Step 2: Order Type -->
    <div id="step2" class="hidden">
        <h2>Choose Order Type</h2>
        <div class="option-grid">
            <div class="option" onclick="nextStep('Pickup', 'type')">Pickup</div>
            <div class="option" onclick="nextStep('Delivery', 'type')">Delivery</div>
        </div>
        <div style="margin-top: 20px;">
            <button class="back-button option" onclick="goBack('step2')">Back</button>
        </div>
    </div>

    <!-- Step 3: Time -->
    <div id="step3" class="hidden">
        <h2>Choose Time</h2>
        <div class="option-grid" id="timeOptionsGrid">
            <div class="option" onclick="selectTime('Now')">Now</div>
            <div class="option" onclick="showLaterDropdown()">Later</div>
        </div>

        <select id="timeDropdown"></select>

        <div id="timeButtonsGrid" class="hidden">
            <button onclick="confirmLaterTime()">Next</button>
            <button class="back-button" onclick="goBack('step3')">Back</button>
        </div>
    </div>

    <!-- Step 4: Order Items with Side Menu -->
    <div id="step4" class="hidden">
        <h2>Choose Items</h2>
        <div class="order-container">
            <div class="side-menu">
                <div class="section-option active" onclick="showSection('pizza')">Pizza</div>
                <div class="section-option" onclick="showSection('drinks')">Drinks</div>
                <div class="section-option" onclick="showSection('sides')">Sides</div>
            </div>
            <div class="section-content" id="sectionContent">
                <!-- Dynamic items loaded here -->
            </div>
        </div>
        <div style="margin-top: 20px; display:flex; gap:10px;">
            <button onclick="nextStep('orderItems', 'items')" style="flex:1;">Next</button>
            <button class="back-button" onclick="goBack('step4')" style="flex:1;">Back</button>
        </div>
    </div>

    <!-- Step 5: Summary -->
    <div id="step5" class="hidden">
        <h2>Order Summary</h2>
        <p id="summary"></p>
        <div style="margin-top: 20px; display:flex; gap:10px;">
            <button onclick="placeOrder()" style="flex:1;">Place Order</button>
            <button onclick="startOver()" style="flex:1;">Start Over</button>
        </div>
    </div>
</div>

<script>
    const orderData = { branch:'', type:'', time:'', items:[] };

    function nextStep(choice, step){
        if(step !== 'items') orderData[step] = choice;
        if(step === 'branch'){
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        } else if(step === 'type'){
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        } else if(step === 'items'){
            document.getElementById('step4').classList.add('hidden');
            showSummary();
        }
    }

    function goBack(step){
        if(step==='step2'){
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        } else if(step==='step3'){
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        } else if(step==='step4'){
            document.getElementById('step4').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        }
    }

    function selectTime(choice){
        orderData.time = choice;
        if(choice==='Now') document.getElementById('step3').classList.add('hidden'), document.getElementById('step4').classList.remove('hidden'), showSection('pizza');
    }

    function showLaterDropdown(){
        const dropdown = document.getElementById('timeDropdown');
        dropdown.innerHTML = '';
        let start = 17*60; const end = 21*60;
        while(start<=end){
            const h = Math.floor(start/60), m = start%60;
            const t = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            dropdown.add(new Option(t,t));
            start += 15;
        }
        dropdown.style.display='block';
        document.getElementById('timeButtonsGrid').classList.remove('hidden');
    }

    function confirmLaterTime(){
        const dropdown = document.getElementById('timeDropdown');
        if(!dropdown.value){ alert('Select a time'); return; }
        orderData.time = dropdown.value;
        document.getElementById('step3').classList.add('hidden');
        document.getElementById('step4').classList.remove('hidden');
        showSection('pizza');
    }

    function showSection(section){
        document.querySelectorAll('.section-option').forEach(el=>el.classList.remove('active'));
        document.querySelector(`.section-option[onclick*="${section}"]`).classList.add('active');

        const content = {
            pizza: ["Margherita","Pepperoni","Hawaiian"],
            drinks: ["Coke","Fanta","Water"],
            sides: ["Garlic Bread","Wings","Salad"]
        };
        const sectionContent = document.getElementById('sectionContent');
        sectionContent.innerHTML = content[section].map(item=>`<div class="item-card" onclick="toggleItem('${item}')">${item}</div>`).join('');
    }

    function toggleItem(item){
        const index = orderData.items.indexOf(item);
        if(index>-1) orderData.items.splice(index,1);
        else orderData.items.push(item);
        console.log("Selected items:", orderData.items);
    }

    function showSummary(){
        document.getElementById('step5').classList.remove('hidden');
        document.getElementById('summary').innerText =
            `Branch: ${orderData.branch}\nOrder Type: ${orderData.type}\nTime: ${orderData.time}\nItems: ${orderData.items.join(', ')}`;
    }

    function placeOrder(){
        alert("Order placed!");
        startOver();
    }

    function startOver(){
        orderData.branch=''; orderData.type=''; orderData.time=''; orderData.items=[];
        document.getElementById('step5').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
        document.getElementById('timeDropdown').style.display='none';
        document.getElementById('timeButtonsGrid').classList.add('hidden');
    }
</script>
</body>
</html>
