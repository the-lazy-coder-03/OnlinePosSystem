<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Pete's Pizza</title>
    <style>
        :root {
            --blue-800: #0d3b80;
            --blue-100: #e9f1ff;
            --bg: #f4f8ff;
            --ink: #0b1220;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(11,42,91,.10);
            max-width: 500px;
        }
        h1 { color: var(--blue-800); }
        p { margin: 1rem 0; color: #566781; }
        .btn {
            display: inline-block;
            background: var(--blue-800);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oops! Something went wrong</h1>
        <p th:text="${message ?: 'An unexpected error occurred.'}"></p>
        <div th:if="${status}">
            <small>Status: <span th:text="${status}">500</span></small>
        </div>
        <br>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
