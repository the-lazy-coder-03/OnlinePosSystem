<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register — Pete’s Pizza</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e6f0ff;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #3366ff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 3em;
            margin: 0;
        }

        header p {
            font-size: 1.2em;
            margin: 5px 0;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        nav a {
            text-decoration: none;
            color: #3366ff;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #3366ff;
            border-radius: 5px;
            transition: all 0.3s;
        }

        nav a:hover {
            background-color: #3366ff;
            color: white;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #3366ff;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px;
            margin-top: 15px;
            background-color: #3366ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #254eda;
        }

        .login-link {
            margin-top: 15px;
            text-align: center;
        }

        .login-link a {
            color: #3366ff;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        #locationBtn {
            background-color: #ff9900;
            margin-top: 10px;
        }

        #locationBtn:hover {
            background-color: #cc7a00;
        }
    </style>
</head>
<body>

<header>
    <h1>Pete’s Pizza</h1>
    <p>Kenridge & Uitzicht Branch</p>
    <p>Call Us: 021 914 3413 | 021 975 4332</p>
</header>

<nav>
    <a href="/order">Order Online</a>
    <a href="/login">Login</a>
    <a href="/register">Sign Up</a>
</nav>

<div class="container">
    <h2>Create an Account</h2>
    <form action="/register" method="post">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>

        <!-- House/Complex optional -->
        <input type="text" name="house_number" id="house_number" placeholder="House / Apartment Number / Complex Name">

        <input type="text" name="street" id="street" placeholder="Street Address" required>
        <input type="text" name="city" id="city" placeholder="City" required>
        <input type="text" name="postalCode" id="postalCode" placeholder="Postal Code" required>
        <input type="text" name="phone" placeholder="Phone Number" required>

        <!-- Preferred Store Dropdown -->
        <label for="preferredStore">Preferred Store:</label>
        <select name="preferred_store" id="preferredStore" required>
            <option value="">Select a store</option>
            <option value="Kenridge Branch">Kenridge Branch</option>
            <option value="Uitzicht Branch">Uitzicht Branch</option>

        </select>

        <button type="button" id="locationBtn">Use My Current Location</button>
        <button type="submit">Register</button>
    </form>
    <div class="login-link">
        Already have an account? <a href="/login">Login here</a>
    </div>
</div>

<script>
    const locationBtn = document.getElementById("locationBtn");

    locationBtn.addEventListener("click", () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(success, error);
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    });

    function success(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`)
            .then(response => response.json())
            .then(data => {
                if(data.address) {
                    document.getElementById("street").value = data.address.road || "";
                    document.getElementById("house_number").value = data.address.house_number || "";
                    document.getElementById("city").value = data.address.city || data.address.town || data.address.village || "";
                    document.getElementById("postalCode").value = data.address.postcode || "";
                }
            })
            .catch(err => {
                console.error(err);
                alert("Unable to fetch full address from your location.");
            });
    }

    function error(err) {
        console.warn(`ERROR(${err.code}): ${err.message}`);
        alert("Location access denied or unavailable.");
    }
</script>

</body>
</html>
