<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Pete's Pizza</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #e6f0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #333;
        }
        .panel {
            width: 420px;
            background: #fff;
            padding: 32px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0052cc;
            font-size: 1.8rem;
            margin: 0 0 20px;
            text-align: center;
        }
        label {
            display: block;
            font-weight: bold;
            margin: 14px 0 8px;
        }
        input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border-radius: 15px;
            border: 2px solid #0052cc;
            background: #f0f6ff;
            font-size: 1rem;
        }
        button {
            width: 100%;
            height: 50px;
            margin-top: 18px;
            border: none;
            border-radius: 15px;
            background: #0052cc;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .error {
            margin-top: 14px;
            color: #b00020;
            text-align: center;
        }
        .hint {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #555;
            line-height: 1.4;
        }
    </style>
</head>
<body>
<main class="panel">
    <h1>Reset Password</h1>
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">

        <label for="password">New Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <div class="hint">Use at least 8 characters with uppercase, lowercase, number, and special character.</div>

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>

        <button type="submit">Reset Password</button>
        <div th:if="${error}" class="error" th:text="${error}"></div>
    </form>
</main>
</body>
</html>
