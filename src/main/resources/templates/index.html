<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pete’s Pizza — Home</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e6f0ff;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #3366ff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.2em;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        nav a {
            text-decoration: none;
            color: #3366ff;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #3366ff;
            border-radius: 5px;
            transition: all 0.3s;
        }

        nav a:hover {
            background-color: #3366ff;
            color: white;
        }

        #locations {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .map-container {
            flex: 1;
            min-width: 300px;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: 0;
        }

        #locations h3 {
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>Pete’s Pizza</h1>
    <p>Kenridge & Uitzicht Branch</p>
    <p>Call Us: 021 914 3413 | 021 975 4332</p>
</header>

<nav>
    <a href="/order">Order Online</a>
    <a href="/login">Login</a>
    <a href="/register">Sign Up</a> <!-- ✅ Sign Up button now points to /register -->
</nav>

<section id="locations">
    <div class="map-container">
        <h3>Kenridge</h3>
        <iframe
                src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d53020.54630933175!2d18.646045413647034!3d-33.84367690902686!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1spete&#39;s%20pizza!5e0!3m2!1sen!2sza!4v1769270664296!5m2!1sen!2sza"
                allowfullscreen>
        </iframe>
    </div>
    <div class="map-container">
        <h3>Uitzicht</h3>
        <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d53020.54630933175!2d18.646045413647034!3d-33.84367690902686!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc568e9ccd0cb5%3A0x62daf552123b8e9!2sPete&#39;s%20Pizza%20Uitzicht!5e0!3m2!1sen!2sza!4v1769270688975!5m2!1sen!2sza"
                allowfullscreen>
        </iframe>
    </div>
</section>

</body>
</html>
