<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Pete’s Pizza — Home</title>

    <style>
        /* =========================
           BODY & HEADER
        ========================= */
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            color: #333;
            margin: 0;
        }

        header {
            background-color: #0052cc; /* blue theme */
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        header h1 { font-size: 3em; margin: 0; }
        header p { margin: 5px 0 0; font-size: 1.2em; }

        /* Profile container in header */
        .profile-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .username { font-weight: bold; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

        .view-profile-btn {
            background-color: #ff9900;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .view-profile-btn:hover {
            background-color: white;
            color: #ff9900;
            border: 2px solid #e6a433;
        }

        /* =========================
           LOGGED IN BAR
        ========================= */
        #logged-in {
            background-color: #cce0ff;
            color: #003366;
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }

        /* =========================
           NAVIGATION
        ========================= */
        nav {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: nowrap;
        }

        .nav-links a {
            width: 150px;
            height: 50px;
            border: 2px solid #0052cc;
            border-radius: 15px;
            color: #0052cc;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 1em;
        }

        .nav-links a:hover {
            background-color: #0052cc;
            color: white;
            transform: scale(1.05);
        }

        /* =========================
           LOCATIONS SECTION
        ========================= */
        #locations {
            display: flex;
            gap: 20px;
            padding: 0 20px 40px;
            flex-wrap: wrap;
        }

        .map-container {
            flex: 1;
            min-width: 300px;
            text-align: center;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .map-container:hover {
            transform: scale(1.03);
        }

        .map-container h3 {
            margin-bottom: 15px;
            color: #0052cc;
        }

        /* View Menu Button */
        .view-menu-btn {
            width: 150px;
            height: 50px;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0052cc;
            border-radius: 15px;
            color: #0052cc;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s;
        }

        .view-menu-btn:hover {
            background-color: #0052cc;
            color: white;
            transform: scale(1.05);
        }

        /* Embedded Maps */
        iframe {
            width: 100%;
            height: 450px;
            border: 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->
<header>
    <h1>Pete’s Pizza</h1>
    <p>Kenridge & Uitzicht Branch</p>

    <div class="profile-container">
        <sec:authorize access="isAuthenticated()">
            <span class="username" th:text="${customerName}">User</span>
            <a th:href="@{/profile/edit}" class="view-profile-btn">View Profile</a>
        </sec:authorize>

        <sec:authorize access="isAnonymous()">
            <span class="username">Guest</span>
        </sec:authorize>
    </div>
</header>

<!-- =========================
     LOGGED IN GREETING
========================= -->
<sec:authorize access="isAuthenticated()">
    <div id="logged-in" th:if="${customerName != null}">
        Hello, <span th:text="${customerName}">User</span>!
    </div>
</sec:authorize>

<!-- =========================
     NAVIGATION LINKS
========================= -->
<nav>
    <div class="nav-links">
        <a href="/order">Order Online</a>

        <th:block sec:authorize="isAnonymous()">
            <a href="/login">Login</a>
            <a href="/register">Sign Up</a>
        </th:block>

        <th:block sec:authorize="isAuthenticated()">
            <a href="#" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">Logout</a>
            <form id="logout-form" th:action="@{/logout}" method="post" style="display:none;"></form>
        </th:block>
    </div>
</nav>

<!-- =========================
     LOCATIONS SECTION
========================= -->
<section id="locations">
    <!-- Kenridge -->
    <div class="map-container">
        <h3>Kenridge</h3>
        <a href="/menu/kenridge" class="view-menu-btn">View Menu</a>
        <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d53020.54630933175!2d18.646045413647034!3d-33.84367690902686!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1spete&#39;s%20pizza!5e0!3m2!1sen!2sza!4v1769270664296!5m2!1sen!2sza" allowfullscreen></iframe>
    </div>

    <!-- Uitzicht -->
    <div class="map-container">
        <h3>Uitzicht</h3>
        <a href="/menu/uitzicht" class="view-menu-btn">View Menu</a>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d53020.54630933175!2d18.646045413647034!3d-33.84367690902686!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc568e9ccd0cb5%3A0x62daf552123b8e9!2sPete&#39;s%20Pizza%20Uitzicht!5e0!3m2!1sen!2sza!4v1769270688975!5m2!1sen!2sza" allowfullscreen></iframe>
    </div>
</section>

</body>
</html>
