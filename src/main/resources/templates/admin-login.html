<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pete's Pizza | Admin Login</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-container {
            text-align: center;
        }

        .brand {
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 3em;
            color: #0052cc;
        }

        .brand p {
            color: #555;
            font-size: 1.1em;
        }

        .login-container {
            background: white;
            padding: 40px 30px;
            width: 380px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .login-container h2 {
            color: #0052cc;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border-radius: 15px;
            border: 2px solid #0052cc;
            font-size: 1em;
            background-color: #f0f6ff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #003d99;
            background-color: #e6f0ff;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            background-color: #0052cc;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: white;
            color: #0052cc;
            border: 2px solid #7a9ac5;
        }

        .error {
            color: red;
            font-size: 0.95em;
            margin-top: 10px;
            text-align: center;
        }

        .extra-links {
            margin-top: 20px;
            text-align: center;
        }

        .extra-links a {
            color: #0052cc;
            text-decoration: none;
            font-weight: bold;
        }

        .extra-links a:hover {
            text-decoration: underline;
            color: #003d99;
        }
    </style>
</head>

<body>
<div class="page-container">
    <div class="brand">
        <h1>Pete's Pizza</h1>
        <p>Admin Panel</p>
    </div>

    <div class="login-container">
        <h2>Admin Login</h2>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="adminLogin" value="true">

            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" placeholder="Enter admin username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">Login to Admin Panel</button>

            <div th:if="${param.error}" class="error">Invalid admin username or password</div>
        </form>

        <div class="extra-links">
            <p><a th:href="@{/login}">User login</a></p>
            <p><a th:href="@{/}">Back to home</a></p>
        </div>
    </div>
</div>
</body>
</html>
