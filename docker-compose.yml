services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_pos_system}
      POSTGRES_USER: ${POSTGRES_USER:-pos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/online_pos_system}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-pos_app}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pos_password}
      SERVER_PORT: 8080
      SERVER_ADDRESS: ${SERVER_ADDRESS:-0.0.0.0}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      RUN_MIGRATION_SQL: ${RUN_MIGRATION_SQL:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_API: ${MAIL_API:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@your-verified-domain.com}
      RESEND_ENDPOINT: ${RESEND_ENDPOINT:-https://api.resend.com/emails}

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
